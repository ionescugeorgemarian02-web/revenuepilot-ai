name: Foundation checks
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Canonical source integrity
        working-directory: docs/canonical
        run: sha256sum -c SHA256SUMS
      - name: Architecture contract
        run: python3 -B -I docs/architecture/check_contract.py
      - name: Local documentation links
        run: python3 -B -I scripts/verify_docs.py
      - name: Build minimal shell
        run: python3 -B -I scripts/build_skeleton.py
      - name: Smoke test
        run: python3 -B -I -m unittest discover -s tests -v
      - name: Git whitespace
        run: git diff --check HEAD^ HEAD
